name: Backup diário do PJJ Portal

on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * *'

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validar configuração
        env:
          GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON }}
        run: |
          missing=0
          for name in GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON; do
            if [ -z "${!name}" ]; then echo "::error::$name não foi configurado nos secrets do repositório"; missing=1; fi
          done
          [ "$missing" -eq 0 ]
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python processor/backup.py
        env:
          GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON }}
          PJJ_PROCESSOR_ORIGIN: ${{ vars.PJJ_PROCESSOR_ORIGIN || 'https://pjj-portal.contato-pjjproducoes.workers.dev' }}
          DRIVE_ROOT_FOLDER_ID: 1sVA2TzVvAQ4mRGSzU6PvXF5vbIFspAvz
