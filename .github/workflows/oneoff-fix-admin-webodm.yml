name: One-off repair admin WebODM classifier

on:
  push:
    branches:
      - fix-admin-runtime-20260904

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-admin-runtime-20260904
          fetch-depth: 0

      - name: Replace fragile embedded regex classifier
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/admin-v2.ts')
          text = path.read_text(encoding='utf-8')
          start_marker = 'function classifyWebOdm(files){'
          end_marker = 'function renderWebOdmPlan(){'
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          replacement = """function classifyWebOdm(files){
          var all=Array.prototype.slice.call(files||[]),plan=[],used=new Set();
          function pathOf(f){return String(f.webkitRelativePath||f.name).split(String.fromCharCode(92)).join('/').toLowerCase()}
          function extension(p){if(p.endsWith('.copc.laz'))return 'copc.laz';var name=p.split('/').pop()||'',dot=name.lastIndexOf('.');return dot>=0?name.slice(dot+1):''}
          function inDir(p,dir){return p.indexOf(dir+'/')===0||p.indexOf('/'+dir+'/')>=0}
          function add(file,type,label,priority){if(!file||used.has(file))return;used.add(file);plan.push({file:file,type:type,title:label,priority:priority||50,path:pathOf(file)})}
          function pick(test,type,label,prefer){var candidates=all.filter(function(f){return test(f,pathOf(f))});candidates.sort(function(a,b){return (prefer?prefer(b,pathOf(b)):0)-(prefer?prefer(a,pathOf(a)):0)||a.size-b.size});if(candidates[0])add(candidates[0],type,label,10)}
          var raster=['tif','tiff'];
          pick(function(f,p){return inDir(p,'odm_orthophoto')&&!p.includes('original')&&raster.includes(extension(p))},'orthophoto','Ortofoto',function(f,p){return (f.name||'').toLowerCase()==='odm_orthophoto.tif'?10:0});
          pick(function(f,p){return inDir(p,'odm_dem')&&p.includes('dsm')&&raster.includes(extension(p))},'dsm','DSM',function(f,p){return (f.name||'').toLowerCase()==='dsm.tif'?10:0});
          pick(function(f,p){return inDir(p,'odm_dem')&&p.includes('dtm')&&raster.includes(extension(p))},'dtm','DTM',function(f,p){return (f.name||'').toLowerCase()==='dtm.tif'?10:0});
          pick(function(f,p){return inDir(p,'odm_georeferencing')&&['copc.laz','laz','las'].includes(extension(p))},'point_cloud','Nuvem de pontos',function(f,p){var n=(f.name||'').toLowerCase();return n==='odm_georeferenced_model.laz'?20:p.includes('copc')?15:0});
          pick(function(f,p){return extension(p)==='pdf'&&(p==='report.pdf'||p.endsWith('/report.pdf')||inDir(p,'odm_report'))},'pdf','Relatório WebODM',function(f,p){return (f.name||'').toLowerCase()==='report.pdf'?10:0});
          var modelFiles=all.filter(function(f){var p=pathOf(f);return inDir(p,'odm_texturing')&&['glb','gltf','obj'].includes(extension(p))});
          modelFiles.sort(function(a,b){var score=function(e){return e==='glb'?30:e==='gltf'?20:e==='obj'?10:0};return score(extension(pathOf(b)))-score(extension(pathOf(a)))});
          var model=modelFiles[0];
          if(model&&extension(pathOf(model))==='obj'){
            all.filter(function(f){var p=pathOf(f);return inDir(p,'odm_texturing')&&['mtl','jpg','jpeg','png','webp','tif','tiff'].includes(extension(p))}).forEach(function(f){add(f,'source','Auxiliar 3D · '+f.name,1)});
            add(model,'model_3d','Modelo 3D',20)
          }else if(model)add(model,'model_3d','Modelo 3D',20);
          all.filter(function(f){var p=pathOf(f);return !used.has(f)&&(inDir(p,'odm_georeferencing')||inDir(p,'odm_orthophoto')||inDir(p,'odm_dem'))&&['geojson','gpkg','shp','shx','dbf','prj','csv'].includes(extension(p))}).forEach(function(f){add(f,'source','Arquivo auxiliar · '+f.name,5)});
          plan.sort(function(a,b){return a.priority-b.priority});return plan
          }
          """
          path.write_text(text[:start] + replacement + text[end:], encoding='utf-8')
          PY

      - name: Validate repository
        run: |
          npm ci --progress=false
          npm run check

      - name: Commit repaired source and remove one-off workflow
        shell: bash
        run: |
          git config user.name "pjj-portal-bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/oneoff-fix-admin-webodm.yml
          git add src/admin-v2.ts
          git commit -m "Fix embedded WebODM classifier syntax"
          git push origin HEAD:fix-admin-runtime-20260904
