name: Processar arquivos PJJ

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

concurrency:
  group: pjj-asset-processor
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - name: Validar configuração
        env:
          GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON }}
        run: |
          missing=0
          for name in GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON; do
            if [ -z "${!name}" ]; then echo "::error::$name não foi configurado nos secrets do repositório"; missing=1; fi
          done
          [ "$missing" -eq 0 ]
      - uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: '3.12'
          auto-activate-base: true
          channels: conda-forge
      - name: Preparar token e reservar próximo job
        id: prepare
        env:
          GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON }}
          PJJ_PROCESSOR_ORIGIN: ${{ vars.PJJ_PROCESSOR_ORIGIN || 'https://pjj-portal.contato-pjjproducoes.workers.dev' }}
        run: |
          python processor/runner.py prepare "$RUNNER_TEMP/pjj-job.json"
      - name: Instalar ferramentas de geoprocessamento
        if: steps.prepare.outputs.has_job == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends assimp-utils file ffmpeg poppler-utils imagemagick
          conda install --yes --channel conda-forge gdal pdal
          sudo npm install --global @gltf-transform/cli
      - name: Processar arquivo reservado
        if: steps.prepare.outputs.has_job == 'true'
        env:
          GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON }}
          PJJ_PROCESSOR_ORIGIN: ${{ vars.PJJ_PROCESSOR_ORIGIN || 'https://pjj-portal.contato-pjjproducoes.workers.dev' }}
        run: python processor/runner.py drain "$RUNNER_TEMP/pjj-job.json"
